<div class="form-content">
  <span>Kebab creation form</span>

  <form class="kebab-form" [formGroup]="createKebabForm">
    <mat-form-field class="example-form-field" appearance="outline">
      <mat-label>Kebab name</mat-label>
      <input matInput type="text" formControlName="name" />

      <button matSuffix mat-icon-button aria-label="Clear">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
    <mat-form-field class="example-form-field" appearance="outline">
      <mat-label>Kebab price</mat-label>
      <input matInput type="text" formControlName="price" />

      <button matSuffix mat-icon-button aria-label="Clear">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
    <mat-form-field class="example-form-field" appearance="outline">
      <mat-label>Kebab sause</mat-label>
      <input matInput type="text" formControlName="sause" />

      <button matSuffix mat-icon-button aria-label="Clear">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
    <mat-form-field class="example-form-field" appearance="outline">
      <mat-label>Kebab size</mat-label>
      <input matInput type="text" formControlName="size" />

      <button matSuffix mat-icon-button aria-label="Clear">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
    <mat-form-field class="example-form-field" appearance="outline">
      <mat-label>Kebab weight</mat-label>
      <input matInput type="text" formControlName="size" />

      <button matSuffix mat-icon-button aria-label="Clear">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </form>
  <div class="btns-content">
    <button mat-raised-button color="error" (click)="onClear()">Clear</button>
    <button mat-raised-button color="primary" (click)="onSave()">Save</button>
  </div>
</div>
