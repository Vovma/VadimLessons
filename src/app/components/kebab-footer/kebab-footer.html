<div class="kebab-page">
  <div class="left-side"></div>
  <div class="right-side"></div>
</div>

<div class="product-card">
  <div class="product2" *ngFor="let yourOwnName of kebabList">
    <div class="product-description image">
      <img src="assets/kebab23.jpg" alt="Kebab" />
    </div>
    <div class="product-description product-name">
      <span>{{ yourOwnName.name }}</span>
    </div>
    <div class="product-description product-price">
      <span>{{ yourOwnName.price }}</span>
    </div>

    <div class="product-description card">
      <button class="add-to-card" (click)="openProduct(yourOwnName)">
        OPEN PRODUCT
      </button>
    </div>
  </div>
</div>

<div class="big-product-card">
  <div class="product2">
    <div class="product-description image">
      <img src="assets/kebab23.jpg" alt="Kebab" />
    </div>
    <div class="product-description product-name">
      <span>{{ homeWorkKebabElement.name }}</span>
    </div>
    <div class="product-description product-price">
      <span>{{ homeWorkKebabElement.price }}</span>
    </div>
    <div class="product-description card">
      <button class="add-to-card" (click)="addToCard(homeWorkKebabElement)">
        ADD TO CARD
      </button>
    </div>
  </div>
</div>
